[project]
name = "systemone-harness"
version = "0.4.0"
description = "A harness for System One models: a controller that drives an environment with a finite action space, one decision per step."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["httpx>=0.27", "pyyaml>=6.0"]

[project.optional-dependencies]
mcp = ["mcp>=2.1"]
browser = ["browser-use>=0.13.10", "mcp>=2.1"]

[project.scripts]
s1 = "systemone_harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["systemone_harness", "systemone_harness.envs"]

[tool.setuptools.package-data]
systemone_harness = ["examples/*.yaml"]
